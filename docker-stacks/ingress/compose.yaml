services:
  caddy:
    image: docker.io/library/caddy:2
    container_name: caddy
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    extra_hosts:
      # Allows Caddy to reach services published on the Docker host by port.
      # This keeps app stacks independent instead of coupling every stack to a
      # shared Docker network on day one.
      - "host.docker.internal:host-gateway"
    labels:
      net.unraid.docker.icon: "https://raw.githubusercontent.com/caddyserver/dist/master/welcome/apple-touch-icon.png"
      net.unraid.docker.webui: "http://[IP]:[PORT:80]/"
      net.unraid.docker.shell: "sh"

  cloudflared:
    image: docker.io/cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TUNNEL_TOKEN:?set_in_dockhand_local_env}
    extra_hosts:
      # Lets Cloudflare Tunnel reach host-published app ports, including the
      # canteen app when it is deployed outside Caddy.
      - "host.docker.internal:host-gateway"
    labels:
      net.unraid.docker.icon: "https://raw.githubusercontent.com/cloudflare/cloudflare-docs/production/assets/logo.svg"
      net.unraid.docker.shell: "sh"

volumes:
  caddy-data:
  caddy-config:
