services:
  caddy:
    image: docker.io/library/caddy:2
    container_name: caddy
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    extra_hosts:
      # Allows Caddy to reach services published on the Docker host by port.
      # This keeps app stacks independent instead of coupling every stack to a
      # shared Docker network on day one.
      - "host.docker.internal:host-gateway"

volumes:
  caddy-data:
  caddy-config:
